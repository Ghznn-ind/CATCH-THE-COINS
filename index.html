<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch The Coin Games</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="header">
            <h1>Catch The Coin Games</h1>
            <p>Catch and collect the coins to get many score points</p>
        </div>
        <div class="container">
            <div class="left-banner">
                <img src="img/left-banner.png" alt="">
            </div>
            <div class="main-area">
                <h3>Gunakan tombol WASD atau panah untuk menggerakkan pemain</h3>
                <canvas id="mainCanvas" width="650" height="450"></canvas>
            </div>
            <div class="right-banner">
                <img src="img/right-banner.png" alt="">
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
